<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 50" width="100%" height="100%">
    <!-- Icône du logo : badge asymétrique bordeaux avec la lettre B en blanc[cite: 2] -->
    <g transform="translate(0, 3)">
        <path d="M 6,2 C 18,0 35,4 38,18 C 42,32 35,44 20,42 C 6,40 2,28 4,16 C 5,8 5,4 6,2 Z" fill="#713b45" />
        <text x="14" y="30" font-family="&#39;Playfair Display&#39;, serif" font-size="22" font-weight="bold" fill="#fffdf8">B</text>
    </g>

    <!-- Texte du logo : "Boek" en brun foncé et "Haven" en couleur champagne[cite: 2] -->
    <text x="52" y="33" font-family="&#39;Playfair Display&#39;, serif" font-size="26" font-weight="600" letter-spacing="-0.7">
        <tspan fill="#30231b">Boek</tspan><tspan fill="#987958">Haven</tspan>
    </text>
</svg>